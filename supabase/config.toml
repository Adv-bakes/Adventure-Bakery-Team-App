project_id = "zsukaixinoqmggpxxonn"

[functions.send-prf-confirmation]
verify_jwt = false

[functions.finalize-pss-submission]
verify_jwt = false

[functions.tts-elevenlabs]
verify_jwt = true

# Admin-only account management. Unlisted functions already default to
# verify_jwt = true; stated explicitly because this one changes passwords.
[functions.admin-user-account]
verify_jwt = true

# Invite acceptance is necessarily anonymous — the caller has no account yet.
# The single-use, expiring invitation token is the credential, and the function
# validates it before touching anything.
[functions.accept-invitation]
verify_jwt = false

# Runs from pg_cron every 15 minutes, which posts a service-role bearer token, so the
# default JWT check is correct here and is stated rather than assumed: this function opens
# alerts and sends mail, and must never be callable anonymously.
[functions.temperature-alert]
verify_jwt = true
